# event-calendar.miraestudio.id on cyrene, via the host cloudflared tunnel -> 127.0.0.1:3105.
# Images built on the laptop with `cyrene-build` from this repo (backend, scraper, frontend subdirs);
# pin the commit in .env (IMAGE_TAG). API_KEY lives in .env too.
# Deploy: edit IMAGE_TAG, `docker compose pull && docker compose up -d`.
name: event-calendar

x-limits: &limits
  restart: unless-stopped
  cgroup_parent: demos.slice
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  backend:
    <<: *limits
    image: ghcr.io/nael-nathanael/event-calendar-backend:${IMAGE_TAG:?set IMAGE_TAG in .env}
    user: "1000:1000"
    environment:
      DATABASE_URL: sqlite:///data/events.db
      API_KEY: ${API_KEY:?set API_KEY in .env}
      RUST_LOG: backend=info,tower_http=info
    volumes:
      - ./data:/data
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5

  scraper:
    <<: *limits
    image: ghcr.io/nael-nathanael/event-calendar-scraper:${IMAGE_TAG:?set IMAGE_TAG in .env}
    depends_on: [backend, flaresolverr]
    environment:
      BACKEND_URL: http://backend:8081
      API_KEY: ${API_KEY:?set API_KEY in .env}
      FLARESOLVERR_URL: http://flaresolverr:8191/v1
      RUST_LOG: info
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5

  # Headless Chromium for pages plain HTTP can't read (Instagram without a login).
  # Published on cyrene's tailnet address only, so other tailnet tools (pameran-indonesia-event-scrapper) share it.
  # Upstream's Dockerfile rebuilt with `cyrene-build` from FlareSolverr master: the v3.5.2 release image ships an
  # old Chromium with critical CVEs.
  flaresolverr:
    <<: *limits
    image: ghcr.io/nael-nathanael/flaresolverr:cc2224b21e31c09a713eb25690a8e8dcdf50d8d8
    ports:
      - 100.72.128.107:8191:8191
    environment:
      LOG_LEVEL: info
      TZ: Asia/Jakarta
    # 1g ran out on debindo's 716-row event table (Chrome 152).
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1

  web:
    <<: *limits
    image: ghcr.io/nael-nathanael/event-calendar-web:${IMAGE_TAG:?set IMAGE_TAG in .env}
    depends_on: [backend]
    ports:
      - 127.0.0.1:3105:3000
    environment:
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 20s
